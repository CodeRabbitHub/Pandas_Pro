[project]
name = "pandas-playbook"
version = "0.1.0"
description = "Pandas Pro — Master Technical Curriculum & Interview Preparation Guide"
authors = [
    { name = "CodeRabbitHub", email = "amanroland@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "notebook>=7.6.3",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
]

[project.scripts]
pandas-pro = "pandas_pro:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
